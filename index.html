<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>備品管理</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
  :root{--primary:#1a5276;--primary-hover:#154360;--background-color:#f8f9fa;}
  body{font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:#f0f2f5;}
  .container{max-width:900px;padding:1rem;}
  .db-badge{background:#1a5276;color:#fff;padding:.4rem .9rem;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:.5rem;}
  .card{background:#fff;border-radius:12px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .btn-primary{background:#1a5276;border-color:#1a5276;}
  .btn-primary:hover{background:#154360;border-color:#154360;}
  .btn-outline{border:1px solid #1a5276;color:#1a5276;background:#fff;}
  .btn-outline:hover{background:#1a5276;color:#fff;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;}
  .item-card{display:flex;gap:1rem;align-items:flex-start;}
  .item-img{width:80px;height:80px;object-fit:cover;border-radius:8px;background:#e9ecef;flex-shrink:0;}
  .item-info{flex:1;}
  .item-name{font-weight:700;font-size:1.05rem;margin-bottom:.2rem;}
  .item-meta{color:#666;font-size:.88rem;}
  .tag{background:#e8f4f8;color:#1a5276;padding:.15rem .5rem;border-radius:4px;font-size:.8rem;display:inline-block;margin-right:.3rem;}
  .empty{text-align:center;color:#888;padding:2rem;}
  .search-box{display:flex;gap:.5rem;margin-bottom:.8rem;}
  .search-box input{flex:1;}
  .filter-btns{display:flex;gap:.5rem;margin-bottom:1rem;}
  .filter-btns button{flex:1;font-size:.85rem;padding:.5rem;}
  .filter-btns button.active{background:#1a5276;color:#fff;border-color:#1a5276;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem;}
  .modal.show{display:flex;}
  .modal-content{background:#fff;border-radius:12px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:1.5rem;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
  .modal-header h3{margin:0;}
  .close-btn{background:none;border:none;font-size:1.5rem;cursor:pointer;color:#666;}
  .form-group{margin-bottom:.8rem;}
  .form-group label{display:block;font-size:.9rem;font-weight:600;margin-bottom:.3rem;}
  .form-group input,.form-group select,.form-group textarea{width:100%;}
  .img-preview{max-width:120px;max-height:120px;border-radius:8px;margin-top:.5rem;}
  .section-title{font-size:.85rem;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.05em;margin:1.5rem 0 .5rem;}
  .db-list{list-style:none;padding:0;margin:0;}
  .db-list li{padding:.7rem;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .db-list li:hover{background:#f8f9fa;}
  .db-list li.active{background:#e8f4f8;font-weight:700;}
  .danger{color:#c0392b;}
  .success{color:#27ae60;}
  .small{font-size:.85rem;}
  .mt-1{margin-top:1rem;}
  .mb-0{margin-bottom:0;}
  .center{text-align:center;}
  .right{text-align:right;}
  .hidden{display:none !important;}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="container">

  <!-- 現在のDB表示 -->
  <div class="card" style="padding:.8rem 1.2rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <span class="db-badge">📁 <span id="currentDbName">DB未選択</span></span>
      </div>
      <button class="btn-outline small" onclick="showDbSelector()">📂 DBを選択</button>
    </div>
  </div>

  <!-- メニュー -->
  <div class="grid-2">
    <button class="btn-primary" onclick="showAddForm()">＋ 備品を登録</button>
    <button class="btn-outline" onclick="showItemList()">📋 一覧を見る</button>
  </div>

  <!-- 検索 -->
  <div class="card" style="padding:1rem;">
    <div class="search-box">
      <input type="search" id="searchInput" placeholder="名称・仕様・場・購入先・備考で検索" oninput="renderItems()">
      <button class="btn-primary" onclick="renderItems()">🔍</button>
    </div>
    <div class="filter-btns">
      <button id="filterAll" class="active" onclick="setFilter('all')">すべて</button>
      <button id="filterImg" onclick="setFilter('image')">🖼 画像あり</button>
      <button id="filterNoImg" onclick="setFilter('noimage')">🚫 画像なし</button>
    </div>
    <div id="itemList"></div>
    <div class="small right" style="margin-top:.5rem;color:#888;">
      表示：<span id="showingCount">0</span>件 / 登録：<span id="totalCount">0</span>件
    </div>
  </div>

  <!-- バクアップ・キャッシュ -->
  <div class="card" style="padding:1rem;">
    <button class="outline small" onclick="clearCache()">🧹 キャッシュをクリアして再読み込み</button>
  </div>

  <!-- DB管理（管理者用・最下部） -->
  <div class="section-title">🔧 DB管理（初期設定・管理者用）</div>
  <div class="card">
    <div class="grid-2">
      <button class="btn-primary" onclick="showCreateDb()">＋ 新しいDB</button>
      <button class="btn-outline" onclick="saveCurrentDb()">💾 現在のDBを保存</button>
      <button class="btn-outline" onclick="refreshDbList()">🔄 DB一覧を更新</button>
      <button class="btn-outline" onclick="showAddUser()">👥 利用者を追加</button>
    </div>
    <div style="margin-top:.8rem;">
      <button class="outline small" onclick="showManageOptions()" style="width:100%;">⚙️ 候補リストを管理</button>
    </div>
    <div style="margin-top:.8rem;">
      <button class="outline small danger" onclick="deleteSelectedDb()" style="width:100%;">🗑️ 選択したDBを削除</button>
    </div>
  </div>

</div>

<!-- DB選択モーダル -->
<div id="dbSelectorModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📂 DBを選択</h3>
      <button class="close-btn" onclick="closeModal('dbSelectorModal')">&times;</button>
    </div>
    <ul id="dbList" class="db-list"></ul>
    <div id="dbListEmpty" class="empty hidden">DBがありません。「DB一覧を更新」を押してください。</div>
  </div>
</div>

<!-- 備品登録モーダル -->
<div id="addFormModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>＋ 備品を登録</h3>
      <button class="close-btn" onclick="closeModal('addFormModal')">&times;</button>
    </div>
    <form onsubmit="event.preventDefault(); saveItem();">
      <input type="hidden" id="itemId">
      <div class="form-group">
        <label>名称 *</label>
        <input type="text" id="itemName" required>
      </div>
      <div class="form-group">
        <label>仕様・型番</label>
        <input type="text" id="itemSpec">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>数量</label>
          <input type="number" id="itemQty" value="1" min="1">
        </div>
        <div class="form-group">
          <label>保管場所</label>
          <select id="itemLocation"></select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>購入日</label>
          <input type="date" id="itemObtained">
        </div>
        <div class="form-group">
          <label>有効期限</label>
          <input type="date" id="itemExpiry">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>購入先</label>
          <select id="itemStore"></select>
        </div>
        <div class="form-group">
          <label>価格（円）</label>
          <input type="number" id="itemPrice" min="0">
        </div>
      </div>
      <div class="form-group">
        <label>画像</label>
        <input type="file" id="itemImage" accept="image/*" onchange="previewImage()">
        <img id="imgPreview" class="img-preview hidden">
      </div>
      <div class="form-group">
        <label>備考</label>
        <textarea id="itemMemo" rows="2"></textarea>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">💾 保存</button>
    </form>
  </div>
</div>

<!-- 新規DB作成モーダル -->
<div id="createDbModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>＋ 新しいDB</h3>
      <button class="close-btn" onclick="closeModal('createDbModal')">&times;</button>
    </div>
    <form onsubmit="event.preventDefault(); createDb();">
      <div class="form-group">
        <label>DB名 *</label>
        <input type="text" id="newDbName" required placeholder="例：自家用、作業用">
      </div>
      <div class="form-group">
        <label>編集者のGoogleアカウント（カンマ区切り・省略可）</label>
        <input type="text" id="newDbEditors" placeholder="例：user@gmail.com">
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">作成</button>
    </form>
  </div>
</div>

<!-- 利用者追加モーダル -->
<div id="addUserModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>👥 利用者を追加</h3>
      <button class="close-btn" onclick="closeModal('addUserModal')">&times;</button>
    </div>
    <form onsubmit="event.preventDefault(); addUser();">
      <div class="form-group">
        <label>追加するGoogleアカウント *</label>
        <input type="email" id="addUserEmail" required placeholder="user@gmail.com">
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">追加</button>
    </form>
  </div>
</div>

<!-- 候補リスト管理モーダル -->
<div id="optionsModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>⚙️ 候補リストを管理</h3>
      <button class="close-btn" onclick="closeModal('optionsModal')">&times;</button>
    </div>
    <div class="form-group">
      <label>保管場所（改行区切り）</label>
      <textarea id="locationsInput" rows="4"></textarea>
    </div>
    <div class="form-group">
      <label>購入先（改行区切り）</label>
      <textarea id="storesInput" rows="4"></textarea>
    </div>
    <button class="btn-primary" style="width:100%;" onclick="saveOptions()">💾 保存</button>
  </div>
</div>

<script>
/* ===================== 状態 ===================== */
let activeDb = null;
let dbRegistry = [];
let items = [];
let settings = {locations:[],stores:[]};
let currentFilter = 'all';

/* ===================== 初期化 ===================== */
document.addEventListener('DOMContentLoaded', async () => {
  await loadRegistry();
  const lastId = localStorage.getItem('lastDbId');
  if (lastId) {
    const db = dbRegistry.find(d => d.spreadsheetId === lastId);
    if (db) await openDb(db);
  }
  renderItems();
});

/* ===================== DB選択 ===================== */
function showDbSelector() {
  renderDbList();
  document.getElementById('dbSelectorModal').classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
function renderDbList() {
  const list = document.getElementById('dbList');
  const empty = document.getElementById('dbListEmpty');
  list.innerHTML = '';
  if (!dbRegistry.length) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  dbRegistry.forEach(db => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${escapeHtml(db.name)}</span><span class="small">${db.spreadsheetId === activeDb?.spreadsheetId ? '✓' : ''}</span>`;
    if (db.spreadsheetId === activeDb?.spreadsheetId) li.classList.add('active');
    li.onclick = () => openDb(db);
    list.appendChild(li);
  });
}
async function openDb(db) {
  activeDb = db;
  localStorage.setItem('lastDbName', db.name);
  localStorage.setItem('lastDbId', db.spreadsheetId);
  document.getElementById('currentDbName').textContent = db.name;
  closeModal('dbSelectorModal');
  await loadDbData();
  renderItems();
  populateSelects();
}
async function loadDbData() {
  if (!activeDb) return;
  try {
    const res = await fetch(MANAGER_URL + '?op=all&spreadsheetId=' + encodeURIComponent(activeDb.spreadsheetId));
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    items = data.items || [];
    settings = data.settings || {locations:[],stores:[]};
    populateSelects();
  } catch (err) {
    alert('DB読み込みエラー：' + err.message);
  }
}
function populateSelects() {
  const locSel = document.getElementById('itemLocation');
  const storeSel = document.getElementById('itemStore');
  const savedLoc = locSel.value;
  const savedStore = storeSel.value;
  locSel.innerHTML = settings.locations.map(l => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('');
  storeSel.innerHTML = settings.stores.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  if (savedLoc) locSel.value = savedLoc;
  if (savedStore) storeSel.value = savedStore;
}

/* ===================== 備品一覧 ===================== */
function showItemList() {
  document.getElementById('searchInput').scrollIntoView({behavior:'smooth'});
}
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btns button').forEach(b => b.classList.remove('active'));
  document.getElementById('filter' + (f==='all'?'All':f==='image'?'Img':'NoImg')).classList.add('active');
  renderItems();
}
function renderItems() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let filtered = items.filter(it => {
    if (currentFilter === 'image' && !it.image) return false;
    if (currentFilter === 'noimage' && it.image) return false;
    if (!q) return true;
    const text = [it.name,it.spec,it.location,it.store,it.memo].join(' ').toLowerCase();
    return text.includes(q);
  });
  document.getElementById('showingCount').textContent = filtered.length;
  document.getElementById('totalCount').textContent = items.length;
  const container = document.getElementById('itemList');
  if (!filtered.length) {
    container.innerHTML = '<div class="empty">該当する備品はありません。</div>';
    return;
  }
  container.innerHTML = filtered.map(it => `
    <div class="card item-card" style="padding:.8rem;">
      ${it.image ? `<img src="${it.image}" class="item-img" alt="">` : '<div class="item-img" style="display:flex;align-items:center;justify-content:center;color:#aaa;font-size:.7rem;">画像なし</div>'}
      <div class="item-info">
        <div class="item-name">${escapeHtml(it.name)}</div>
        <div class="item-meta">
          ${it.spec ? escapeHtml(it.spec)+' | ' : ''}
          ${it.quantity ? '数量:'+it.quantity+' | ' : ''}
          ${it.location ? '📍'+escapeHtml(it.location)+' | ' : ''}
          ${it.store ? '🛒'+escapeHtml(it.store) : ''}
        </div>
        <div class="item-meta" style="margin-top:.3rem;">
          ${it.obtained ? '購入:'+formatDate(it.obtained)+' | ' : ''}
          ${it.expiry ? '期限:'+formatDate(it.expiry)+' | ' : ''}
          ${it.price ? '¥'+Number(it.price).toLocaleString() : ''}
        </div>
        ${it.memo ? `<div class="item-meta" style="margin-top:.3rem;">📝 ${escapeHtml(it.memo)}</div>` : ''}
        <div style="margin-top:.5rem;">
          <button class="small btn-outline" onclick="editItem('${it.id}')">✏️ 編集</button>
          <button class="small outline danger" onclick="deleteItem('${it.id}')">🗑️ 削除</button>
        </div>
      </div>
    </div>
  `).join('');
}

/* ===================== 備品登録・編集 ===================== */
function showAddForm() {
  if (!activeDb) { alert('先にDBを選択してください。'); return; }
  document.getElementById('itemId').value = '';
  document.getElementById('itemName').value = '';
  document.getElementById('itemSpec').value = '';
  document.getElementById('itemQty').value = 1;
  document.getElementById('itemObtained').value = '';
  document.getElementById('itemExpiry').value = '';
  document.getElementById('itemPrice').value = '';
  document.getElementById('itemMemo').value = '';
  document.getElementById('itemImage').value = '';
  document.getElementById('imgPreview').classList.add('hidden');
  populateSelects();
  document.getElementById('addFormModal').classList.add('show');
}
function previewImage() {
  const file = document.getElementById('itemImage').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('imgPreview');
    img.src = e.target.result;
    img.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}
async function saveItem() {
  if (!activeDb) return;
  const id = document.getElementById('itemId').value || crypto.randomUUID();
  const name = document.getElementById('itemName').value.trim();
  if (!name) { alert('名称を入力してください。'); return; }
  const file = document.getElementById('itemImage').files[0];
  let image = '';
  const existing = items.find(i => i.id === id);
  if (existing && existing.image && !file) image = existing.image;
  if (file) {
    image = await new Promise(resolve => {
      const r = new FileReader();
      r.onload = e => resolve(e.target.result);
      r.readAsDataURL(file);
    });
  }
  const item = {
    id, name,
    spec: document.getElementById('itemSpec').value.trim(),
    quantity: parseInt(document.getElementById('itemQty').value) || 1,
    image,
    location: document.getElementById('itemLocation').value,
    obtained: document.getElementById('itemObtained').value,
    expiry: document.getElementById('itemExpiry').value,
    store: document.getElementById('itemStore').value,
    price: parseInt(document.getElementById('itemPrice').value) || '',
    memo: document.getElementById('itemMemo').value.trim(),
    updatedAt: new Date().toISOString()
  };
  if (!existing) item.createdAt = item.updatedAt;
  try {
    const res = await fetch(MANAGER_URL, {
      method: 'POST',
      body: new URLSearchParams({payload: JSON.stringify({action:'saveItem', spreadsheetId:activeDb.spreadsheetId, item})})
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    const idx = items.findIndex(i => i.id === id);
    if (idx >= 0) items[idx] = item; else items.push(item);
    renderItems();
    closeModal('addFormModal');
  } catch (err) {
    alert('保存エラー：' + err.message);
  }
}
function editItem(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  document.getElementById('itemId').value = it.id;
  document.getElementById('itemName').value = it.name;
  document.getElementById('itemSpec').value = it.spec || '';
  document.getElementById('itemQty').value = it.quantity || 1;
  document.getElementById('itemLocation').value = it.location || '';
  document.getElementById('itemObtained').value = it.obtained || '';
  document.getElementById('itemExpiry').value = it.expiry || '';
  document.getElementById('itemStore').value = it.store || '';
  document.getElementById('itemPrice').value = it.price || '';
  document.getElementById('itemMemo').value = it.memo || '';
  if (it.image) {
    document.getElementById('imgPreview').src = it.image;
    document.getElementById('imgPreview').classList.remove('hidden');
  } else {
    document.getElementById('imgPreview').classList.add('hidden');
  }
  populateSelects();
  document.getElementById('addFormModal').classList.add('show');
}
async function deleteItem(id) {
  if (!confirm('この備品を削除しますか？')) return;
  try {
    const res = await fetch(MANAGER_URL, {
      method: 'POST',
      body: new URLSearchParams({payload: JSON.stringify({action:'deleteItem', spreadsheetId:activeDb.spreadsheetId, id})})
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    items = items.filter(i => i.id !== id);
    renderItems();
  } catch (err) {
    alert('削除エラー：' + err.message);
  }
}

/* ===================== DB管理 ===================== */
async function loadRegistry() {
  try {
    const res = await fetch(MANAGER_URL + '?op=list');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    dbRegistry = data.databases || [];
  } catch (err) {
    console.error('DB一覧取得失敗', err);
  }
}
async function refreshDbList() {
  try {
    const res = await fetch(MANAGER_URL + '?op=list');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    dbRegistry = data.databases || [];
    alert('DB一覧を更新しました。' + dbRegistry.length + '件');
    renderDbList();
  } catch (err) {
    alert('更新エラー：' + err.message);
  }
}
function showCreateDb() {
  document.getElementById('newDbName').value = '';
  document.getElementById('newDbEditors').value = '';
  document.getElementById('createDbModal').classList.add('show');
}
async function createDb() {
  const name = document.getElementById('newDbName').value.trim();
  if (!name) { alert('DB名を入力してください。'); return; }
  const editors = document.getElementById('newDbEditors').value.split(',').map(s=>s.trim()).filter(Boolean);
  try {
    const res = await fetch(MANAGER_URL + '?op=create&name=' + encodeURIComponent(name) + '&editors=' + encodeURIComponent(editors.join(',')));
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    await refreshDbList();
    closeModal('createDbModal');
    alert('「'+name+'」を作成しました。');
    await openDb(data.database);
  } catch (err) {
    alert('新しいDBの作成に失敗しました。\n\n' + err.message);
  }
}
async function saveCurrentDb() {
  if (!activeDb) { alert('DBが選択されていません。'); return; }
  if (!confirm('クラウドに保存しますか？（現在のDBの内容が上書きされます）')) return;
  try {
    const res = await fetch(MANAGER_URL, {
      method: 'POST',
      body: new URLSearchParams({payload: JSON.stringify({
        action:'saveAll',
        spreadsheetId:activeDb.spreadsheetId,
        items,
        settings
      })})
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    alert('保存しました。（'+data.count+'件）');
  } catch (err) {
    alert('保存エラー：' + err.message);
  }
}
function showAddUser() {
  if (!activeDb) { alert('先にDBを選択してください。'); return; }
  document.getElementById('addUserEmail').value = '';
  document.getElementById('addUserModal').classList.add('show');
}
async function addUser() {
  if (!activeDb) return;
  const email = document.getElementById('addUserEmail').value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert('正しいメールアドレスを入力してください。'); return;
  }
  try {
    const res = await fetch(MANAGER_URL + '?op=addUser&spreadsheetId=' + encodeURIComponent(activeDb.spreadsheetId) + '&email=' + encodeURIComponent(email));
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    alert('追加しました。');
    closeModal('addUserModal');
  } catch (err) {
    alert('追加エラー：' + err.message);
  }
}
async function deleteSelectedDb() {
  if (!activeDb) { alert('先にDBを選択してください。'); return; }
  if (!confirm('「'+activeDb.name+'」を削除しますか？\n（スプレッドシートもゴミ箱に移動します）')) return;
  if (!confirm('本当に削除しますか？この操作は元に戻せません。')) return;
  try {
    const res = await fetch(MANAGER_URL + '?op=delete&spreadsheetId=' + encodeURIComponent(activeDb.spreadsheetId));
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    alert('削除しました。');
    activeDb = null;
    localStorage.removeItem('lastDbName');
    localStorage.removeItem('lastDbId');
    document.getElementById('currentDbName').textContent = 'DB未選択';
    items = [];
    renderItems();
    await refreshDbList();
  } catch (err) {
    alert('削除エラー：' + err.message);
  }
}

/* ===================== 候補リスト管理 ===================== */
function showManageOptions() {
  if (!activeDb) { alert('先にDBを選択してください。'); return; }
  document.getElementById('locationsInput').value = (settings.locations||[]).join('\n');
  document.getElementById('storesInput').value = (settings.stores||[]).join('\n');
  document.getElementById('optionsModal').classList.add('show');
}
async function saveOptions() {
  if (!activeDb) return;
  settings.locations = document.getElementById('locationsInput').value.split('\n').map(s=>s.trim()).filter(Boolean);
  settings.stores = document.getElementById('storesInput').value.split('\n').map(s=>s.trim()).filter(Boolean);
  try {
    const res = await fetch(MANAGER_URL, {
      method: 'POST',
      body: new URLSearchParams({payload: JSON.stringify({action:'saveSettings', spreadsheetId:activeDb.spreadsheetId, settings})})
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    populateSelects();
    closeModal('optionsModal');
    alert('保存しました。');
  } catch (err) {
    alert('保存エラー：' + err.message);
  }
}

/* ===================== キャッシュ ===================== */
function clearCache() {
  localStorage.clear();
  location.reload();
}

/* ===================== ユーティリティ ===================== */
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatDate(d) {
  if (!d) return '';
  const s = String(d);
  if (s.match(/^\d{4}-\d{2}-\d{2}$/)) return s;
  try { return new Date(s).toISOString().split('T')[0]; } catch(e) { return s; }
}
