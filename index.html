<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備品管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
  :root{--primary:#1f6feb;--primary-hover:#388bfd;}
  body{padding:1rem;}
  .hidden{display:none !important;}
  .db-badge{display:inline-flex;align-items:center;gap:.5rem;background:#1f2937;padding:.35rem .8rem;border-radius:999px;font-size:.9rem;}
  .db-badge .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;}
  .item-card{border:1px solid #374151;border-radius:.5rem;padding:1rem;background:#111827;color:#f8fafc;}
  .item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;}
  .item-grid .item-card img{width:100%;height:140px;object-fit:cover;border-radius:.35rem;background:#1f2937;}

  /* 画像ありリスト形式 */
  .item-list{display:flex;flex-direction:column;gap:.75rem;}
  .item-list > .item-card{display:flex;gap:1rem;align-items:flex-start;padding:1rem;}
  .item-list > .item-card > img,
  .item-list > .item-card > .img-placeholder{
    width:120px !important;
    height:120px !important;
    object-fit:cover;
    border-radius:.35rem;
    flex-shrink:0;
    background:#1f2937;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#94a3b8;
    font-size:.75rem;
  }

  /* 画像なしリスト形式（番号付きコンパクト） */
  .item-list-noimg{display:flex !important;flex-direction:column !important;gap:.5rem !important;}
  .item-list-noimg > .item-card{
    display:flex !important;
    gap:.75rem !important;
    align-items:flex-start !important;
    padding:.75rem 1rem !important;
  }
  .item-list-noimg > .item-card > .item-number{
    flex: 0 0 48px !important;
    width: 48px !important;
    height: 48px !important;
    min-width: 48px !important;
    max-width: 48px !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    background:#1f6feb !important;
    color:#fff !important;
    border-radius:50% !important;
    font-size:.7rem !important;
    font-weight:700 !important;
    margin-top:.15rem !important;
    box-sizing:border-box !important;
    line-height:1 !important;
    padding:0 !important;
    overflow:hidden !important;
    letter-spacing:-0.03em !important;
    white-space:nowrap !important;
    text-align:center !important;
    border:none !important;
    aspect-ratio:1 / 1 !important;
  }
  .item-list-noimg > .item-card > div{flex:1;min-width:0;}
  .list-summary{text-align:right;padding:.75rem 1rem;background:#1e293b;border:1px solid #374151;border-radius:.5rem;margin-top:.5rem;color:#e2e8f0;font-size:.9rem;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99999;padding:1rem;}
  .modal-overlay.open{display:flex !important;}
  .modal{background:#1e293b;padding:1.5rem;border-radius:.75rem;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;position:relative;border:2px solid #4b5563;}
  .modal label{color:#e2e8f0;font-weight:500;}
  .modal input,.modal select,.modal textarea{background:#f8fafc;color:#1f2937;}
  .modal h3{color:#f8fafc;margin-top:0;}
  .close-btn{position:absolute;top:.8rem;right:1rem;background:none;border:none;font-size:1.5rem;color:#9ca3af;cursor:pointer;}
  .db-screen{position:fixed;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;}
  .db-screen h2{margin-bottom:1rem;color:#e2e8f0;}
  .db-screen p{color:#e2e8f0;margin-bottom:2rem;}
  .db-select-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;width:100%;max-width:800px;}
  .db-select-card{background:#1e293b;border:2px solid #334155;border-radius:.75rem;padding:1.5rem;cursor:pointer;transition:.2s;text-align:left;color:#f8fafc;}
  .db-select-card:hover{border-color:#1f6feb;background:#1e293b;}
  .db-select-card.active{border-color:#22c55e;background:#064e3b;}
  .db-select-card .db-name{font-weight:700;font-size:1.1rem;margin-bottom:.25rem;color:#f8fafc;}
  .db-select-card .db-meta{font-size:.8rem;color:#cbd5e1;}
  .empty-state{text-align:center;padding:3rem 1rem;color:#e2e8f0;}
  .tag{display:inline-block;background:#1f2937;padding:.15rem .5rem;border-radius:.25rem;font-size:.75rem;margin-right:.25rem;}
  .action-btns{display:flex;gap:.5rem;flex-wrap:wrap;}
  .action-btns button{padding:.4rem .8rem;font-size:.8rem;}
  .search-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;}
  .search-row input,.search-row select{flex:1 1 180px;margin-bottom:0;}
  .section-title{font-size:1.1rem;font-weight:700;margin:1.5rem 0 .5rem;padding-bottom:.35rem;border-bottom:2px solid #1f6feb;display:inline-block;}
  .danger{color:#ef4444;}
  .db-manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
  @media(max-width:640px){.db-manage-grid{grid-template-columns:1fr;}}
  .toast{position:fixed;bottom:1rem;right:1rem;background:#1f6feb;color:#fff;padding:.75rem 1.25rem;border-radius:.5rem;box-shadow:0 4px 12px rgba(0,0,0,.3);transform:translateY(120%);transition:.3s;z-index:100000;}
  .toast.show{transform:translateY(0);}
  .current-db-bar{background:#1e293b;border:1px solid #374151;border-radius:.5rem;padding:.75rem 1rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;}
  .current-db-label{color:#94a3b8;font-size:.85rem;}
  .current-db-name{color:#e2e8f0;font-weight:700;font-size:1.05rem;}
  .manage-layout{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
  @media(max-width:640px){.manage-layout{grid-template-columns:1fr;}}
  .manage-section{margin-bottom:1rem;}
  .manage-section h4{margin:0 0 .5rem;color:#f8fafc;font-size:1rem;border-bottom:1px solid #374151;padding-bottom:.25rem;}
  .user-list{font-size:.85rem;color:#f8fafc;max-height:120px;overflow-y:auto;}
  .user-list-item{padding:.2rem 0;border-bottom:1px solid #334155;}
</style>
<script src="config.js"></script>
</head>
<body>

<!-- DB選択画面（初回のみ） -->
<div id="dbScreen" class="db-screen">
  <h2>備品管理クラウド</h2>
  <p>管理するデータベースを選択してください</p>
  <div id="dbSelectGrid" class="db-select-grid"></div>
  <div style="margin-top:2rem;">
    <button class="secondary outline" onclick="showNewDbModal()">+ 新しいDBを作成</button>
  </div>
</div>

<!-- メイン画面 -->
<div id="mainScreen" class="hidden">
  <nav style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;">
    <div style="font-weight:700;font-size:1.1rem;">備品管理</div>
    <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;">
      <div class="db-badge"><span class="dot"></span><span id="currentDbName">DB未選択</span></div>
      <button class="secondary outline" onclick="showDbManageModal()">DB管理</button>
    </div>
  </nav>

  <div class="current-db-bar">
    <div>
      <span class="current-db-label">現在のDB：</span>
      <span class="current-db-name" id="currentDbDisplay">未選択</span>
    </div>
    <div style="font-size:.8rem;color:#94a3b8;" id="currentDbEditors"></div>
  </div>

  <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;">
    <button onclick="showItemModal()">+ 備品を登録</button>
    <button class="secondary" onclick="loadCurrentDb()">一覧を見る</button>
  </div>

  <div class="search-row">
    <input type="search" id="searchInput" placeholder="名称・仕様・保管場所・購入先・備考で検索" oninput="renderItems()">
    <select id="filterLocation" onchange="renderItems()"><option value="">保管場所</option></select>
    <select id="filterStore" onchange="renderItems()"><option value="">購入先</option></select>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;">
    <div id="resultCount" style="font-size:.9rem;color:#e2e8f0;">0件</div>
    <div style="display:flex;gap:.5rem;">
      <button class="secondary outline" onclick="setView('grid')" id="btnGrid" style="padding:.3rem .6rem;" title="画像ありカード">□</button>
      <button class="secondary outline" onclick="setView('list')" id="btnList" style="padding:.3rem .6rem;" title="画像ありリスト">☰</button>
      <button class="secondary outline" onclick="setView('listNoImg')" id="btnListNoImg" style="padding:.3rem .6rem;" title="画像なしリスト（番号付き）">#</button>
    </div>
  </div>

  <div id="itemsContainer" class="item-grid"></div>

  <div style="margin-top:2rem;">
    <button class="secondary outline" onclick="clearCache()">キャッシュをクリア</button>
  </div>
</div>

<!-- 備品登録・編集モーダル -->
<div id="itemModal" class="modal-overlay" onclick="if(event.target===this)closeItemModal()">
  <div class="modal">
    <button class="close-btn" onclick="closeItemModal()">&times;</button>
    <h3 id="itemModalTitle">+ 備品を登録</h3>
    <form id="itemForm" onsubmit="event.preventDefault();saveItem();">
      <input type="hidden" id="itemId">
      <label>名称 *<input id="itemName" required></label>
      <label>仕様・型番<input id="itemSpec"></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;">
        <label>数量<input type="number" id="itemQty" value="1" min="0"></label>
        <label>場所
          <select id="itemLocation"><option value="">選択</option></select>
          <input id="itemLocationCustom" placeholder="または新しい場所" style="margin-top:.3rem;">
        </label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;">
        <label>購入日<input type="date" id="itemObtained"></label>
        <label>有効期限<input type="date" id="itemExpiry"></label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;">
        <label>購入先
          <select id="itemStore"><option value="">選択</option></select>
          <input id="itemStoreCustom" placeholder="または新しい購入先" style="margin-top:.3rem;">
        </label>
        <label>価格（円）<input type="number" id="itemPrice" min="0"></label>
      </div>
      <label>画像<input type="file" id="itemImage" accept="image/*" onchange="previewImage(this)"></label>
      <img id="imagePreview" class="hidden" style="max-height:120px;border-radius:.35rem;margin-bottom:.5rem;">
      <input type="hidden" id="itemImageData">
      <label>備考<textarea id="itemMemo" rows="2"></textarea></label>
      <button type="submit" style="width:100%;">保存</button>
    </form>
  </div>
</div>

<!-- DB作成モーダル -->
<div id="newDbModal" class="modal-overlay" onclick="if(event.target===this)closeNewDbModal()">
  <div class="modal">
    <button class="close-btn" onclick="closeNewDbModal()">&times;</button>
    <h3>+ 新しいDB</h3>
    <form id="newDbForm" onsubmit="event.preventDefault();createDb();">
      <label>DB名 *<input id="newDbName" required></label>
      <label>編集者のGoogleアカウント（カンマ区切り・省略可）<input id="newDbEditors" placeholder="example@gmail.com"></label>
      <button type="submit" style="width:100%;">作成</button>
    </form>
  </div>
</div>

<!-- DB管理モーダル -->
<div id="dbManageModal" class="modal-overlay" onclick="if(event.target===this)closeDbManageModal()">
  <div class="modal" style="max-width:800px;">
    <button class="close-btn" onclick="closeDbManageModal()">&times;</button>
    <h3>DB管理</h3>
    <div class="manage-layout">
      <div>
        <div class="manage-section">
          <h4>DBを選択してください</h4>
          <div style="font-size:.75rem;color:#94a3b8;margin-bottom:.5rem;">カードをクリックしてDBを選択できます</div>
          <div id="manageDbList" style="max-height:250px;overflow-y:auto;"></div>
        </div>
        <div style="margin-top:1rem;">
          <button onclick="showNewDbModal(); closeDbManageModal();" style="width:100%;">+ 新しいDBを作成</button>
        </div>
        <div style="margin-top:.5rem;">
          <button class="secondary outline" onclick="refreshDbListForManage()" style="width:100%;">一覧を更新</button>
        </div>
      </div>
      <div>
        <div class="manage-section">
          <h4>選択中のDB</h4>
          <div id="selectedDbInfo" style="background:#0f172a;padding:1rem;border-radius:.5rem;margin-bottom:1rem;">
            <div style="font-weight:700;font-size:1.1rem;margin-bottom:.5rem;" id="selectedDbName">DB未選択</div>
            <div style="font-size:.8rem;color:#94a3b8;margin-bottom:.25rem;" id="selectedDbId"></div>
            <div style="font-size:.8rem;color:#94a3b8;margin-bottom:.5rem;" id="selectedDbEditors"></div>
            <button onclick="switchToSelectedDb()" id="btnSwitchDb" disabled>このDBを開く</button>
          </div>
        </div>
        <div class="manage-section">
          <h4>利用者を追加</h4>
          <form onsubmit="event.preventDefault();addUserFromManage();">
            <label>Googleアカウント（メール） *<input type="email" id="manageAddUserEmail" required placeholder="example@gmail.com"></label>
            <button type="submit" id="btnAddUser" disabled>追加</button>
          </form>
        </div>
        <div class="manage-section">
          <h4>利用者一覧</h4>
          <div id="manageUserList" class="user-list">
            <div style="color:#6b7280;">DBを選択してください</div>
          </div>
        </div>
        <div style="margin-top:1rem;">
          <button class="danger outline" onclick="deleteSelectedDb()" id="btnDeleteDb" disabled>選択したDBを削除</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
function getManagerUrl(){
  if (typeof CONFIG !== 'undefined' && CONFIG.MANAGER_URL) return CONFIG.MANAGER_URL;
  return '';
}

let databases = [];
let activeDb = null;
let selectedManageDb = null;
let items = [];
let viewMode = 'grid';
let settings = {locations:[], stores:[]};

function $(id){ return document.getElementById(id); }
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }
function openModal(id){ $(id).classList.add('open'); }
function closeModal(id){ $(id).classList.remove('open'); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function genId(){ return 'item_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function fmtDate(d){ if(!d) return ''; const x=new Date(d); return x.getFullYear()+'-'+(String(x.getMonth()+1).padStart(2,'0'))+'-'+String(x.getDate()).padStart(2,'0'); }
function today(){ return fmtDate(new Date()); }

function toQueryString(obj){
  return Object.keys(obj).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(obj[k])).join('&');
}

async function apiGet(op, extra = {}) {
  const managerUrl = getManagerUrl();
  if (!managerUrl) throw new Error('MANAGER_URLが設定されていません。config.jsを確認してください。');
  const qs = toQueryString({op, ...extra});
  const url = managerUrl + (managerUrl.includes('?') ? '&' : '?') + qs;
  const res = await fetch(url, {method:'GET'});
  return res.json();
}

async function apiPost(action, data = {}) {
  const managerUrl = getManagerUrl();
  if (!managerUrl) throw new Error('MANAGER_URLが設定されていません。config.jsを確認してください');
  if (!activeDb || !activeDb.spreadsheetId) throw new Error('DBが選択されていません。');
  const payload = JSON.stringify({ action, spreadsheetId: activeDb.spreadsheetId, ...data });
  const body = toQueryString({ payload });
  const res = await fetch(managerUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });
  return res.json();
}

async function initDbScreen(){
  try {
    const res = await apiGet('list');
    if (!res.ok) throw new Error(res.error || 'DB一覧取得失敗');
    databases = res.databases || [];
    renderDbSelector();
  } catch (err) {
    toast('DB一覧読み込みエラー: ' + err.message);
    databases = [];
    renderDbSelector();
  }
  $('dbScreen').style.display = 'flex';
  hide('mainScreen');
}

function renderDbSelector(){
  const grid = $('dbSelectGrid');
  if (!databases.length) {
    grid.innerHTML = '<p style="color:#e2e8f0;">DBがありません。下のボタンから作成してください。</p>';
    return;
  }
  grid.innerHTML = databases.map(db => `
    <div class="db-select-card" onclick="selectDb('${db.spreadsheetId}')">
      <div class="db-name">${escapeHtml(db.name)}</div>
      <div class="db-meta">${db.editors || '編集者なし'}</div>
    </div>
  `).join('');
}

function selectDb(spreadsheetId){
  const db = databases.find(d => d.spreadsheetId === spreadsheetId);
  if (!db) { toast('DBが見つかりません'); return; }
  activeDb = db;
  localStorage.setItem('lastDbId', db.spreadsheetId);
  updateCurrentDbDisplay();
  $('dbScreen').style.display = 'none';
  show('mainScreen');
  loadCurrentDb();
}

function updateCurrentDbDisplay(){
  if (activeDb) {
    $('currentDbName').textContent = activeDb.name;
    $('currentDbDisplay').textContent = activeDb.name;
    $('currentDbEditors').textContent = activeDb.editors ? '編集者: ' + activeDb.editors : '集者なし';
  } else {
    $('currentDbName').textContent = 'DB未選択';
    $('currentDbDisplay').textContent = '未選択';
    $('currentDbEditors').textContent = '';
  }
}

async function showDbManageModal(){
  await refreshDbListForManage();
  openModal('dbManageModal');
}

function closeDbManageModal(){
  closeModal('dbManageModal');
}

async function refreshDbListForManage(){
  try {
    const res = await apiGet('list');
    if (!res.ok) throw new Error(res.error || 'DB一覧取得失敗');
    databases = res.databases || [];
    renderManageDbList();
    toast('DB一覧を更新しました。' + databases.length + '件');
  } catch (err) {
    toast('DB一覧更新エラー: ' + err.message);
  }
}

function renderManageDbList(){
  const container = $('manageDbList');
  if (!databases.length) {
    container.innerHTML = '<div style="color:#94a3b8;padding:1rem;">DBがありません</div>';
    return;
  }
  container.innerHTML = databases.map(db => {
    const isActive = selectedManageDb && selectedManageDb.spreadsheetId === db.spreadsheetId;
    const isCurrent = activeDb && activeDb.spreadsheetId === db.spreadsheetId;
    return `
      <div class="db-select-card ${isActive ? 'active' : ''}" onclick="selectManageDb('${db.spreadsheetId}')" style="margin-bottom:.5rem;padding:1rem;cursor:pointer;">
        <div class="db-name">${escapeHtml(db.name)} ${isCurrent ? '<span style="color:#22c55e;font-size:.75rem;">[現在]</span>' : ''}</div>
        <div class="db-meta">${db.editors || '編集者なし'}</div>
        ${isActive ? '<div style="font-size:.75rem;color:#22c55e;margin-top:.25rem;">選択中</div>' : '<div style="font-size:.75rem;color:#6b7280;margin-top:.25rem;">クリックして選択</div>'}
      </div>
    `;
  }).join('');
}

function selectManageDb(spreadsheetId){
  const db = databases.find(d => d.spreadsheetId === spreadsheetId);
  if (!db) return;
  selectedManageDb = db;
  $('selectedDbName').textContent = db.name;
  $('selectedDbId').textContent = 'ID: ' + db.spreadsheetId;
  $('selectedDbEditors').textContent = '編集者: ' + (db.editors || 'なし');
  $('btnSwitchDb').disabled = false;
  $('btnAddUser').disabled = false;
  $('btnDeleteDb').disabled = false;
  renderManageDbList();
  renderManageUserList();
}

function renderManageUserList(){
  const container = $('manageUserList');
  if (!selectedManageDb || !selectedManageDb.editors) {
    container.innerHTML = '<div style="color:#6b7280;">利用者がいません</div>';
    return;
  }
  const editors = selectedManageDb.editors.split(',').map(s => s.trim()).filter(Boolean);
  if (!editors.length) {
    container.innerHTML = '<div style="color:#6b7280;">利用者がいません</div>';
    return;
  }
  container.innerHTML = editors.map(email => `
    <div class="user-list-item">${escapeHtml(email)}</div>
  `).join('');
}

function switchToSelectedDb(){
  if (!selectedManageDb) return;
  activeDb = selectedManageDb;
  localStorage.setItem('lastDbId', activeDb.spreadsheetId);
  updateCurrentDbDisplay();
  closeDbManageModal();
  loadCurrentDb();
  toast('「' + activeDb.name + '」を開きました');
}

async function addUserFromManage(){
  const email = $('manageAddUserEmail').value.trim().toLowerCase();
  if (!email || !email.includes('@')) { toast('正しいメールアドレスを入力してください'); return; }
  if (!selectedManageDb) { toast('DBを選択してください'); return; }
  try {
    const res = await apiGet('addUser', { spreadsheetId: selectedManageDb.spreadsheetId, email });
    if (!res.ok) throw new Error(res.error || '追加失敗');
    toast('利用者を追加しました: ' + email);
    $('manageAddUserEmail').value = '';
    await refreshDbListForManage();
    const db = databases.find(d => d.spreadsheetId === selectedManageDb.spreadsheetId);
    if (db) selectManageDb(db.spreadsheetId);
  } catch (err) {
    toast('追加エラー: ' + err.message);
  }
}

async function deleteSelectedDb(){
  if (!selectedManageDb) { toast('DBを選択してください'); return; }
  if (!confirm('「' + selectedManageDb.name + '」を削除しますか？スプレッドシートもゴミ箱に移動します。')) return;
  try {
    const res = await apiGet('delete', { spreadsheetId: selectedManageDb.spreadsheetId });
    if (!res.ok) throw new Error(res.error || '削除失敗');
    toast('DBを削除しました');
    if (activeDb && activeDb.spreadsheetId === selectedManageDb.spreadsheetId) {
      activeDb = null;
      items = [];
      localStorage.removeItem('lastDbId');
      updateCurrentDbDisplay();
      renderItems();
    }
    selectedManageDb = null;
    $('selectedDbName').textContent = 'DB未選択';
    $('selectedDbId').textContent = '';
    $('selectedDbEditors').textContent = '';
    $('btnSwitchDb').disabled = true;
    $('btnAddUser').disabled = true;
    $('btnDeleteDb').disabled = true;
    $('manageUserList').innerHTML = '<div style="color:#6b7280;">DBを選択してください</div>';
    await refreshDbListForManage();
  } catch (err) {
    toast('削除エラー: ' + err.message);
  }
}

async function createDb(){
  const name = $('newDbName').value.trim();
  const editorsRaw = $('newDbEditors').value.trim();
  if (!name) { toast('DB名を入力してください'); return; }
  const editors = editorsRaw ? editorsRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
  try {
    const res = await apiGet('create', { name, editors: editors.join(',') });
    if (!res.ok) throw new Error(res.error || '作成失敗');
    toast('DBを作成ました: ' + name);
    closeNewDbModal();
    $('newDbForm').reset();
    await refreshDbListForManage();
    if (res.database) {
      activeDb = res.database;
      localStorage.setItem('lastDbId', res.database.spreadsheetId);
      updateCurrentDbDisplay();
      if (!$('mainScreen').classList.contains('hidden')) {
        items = [];
        renderItems();
      } else {
        $('dbScreen').style.display = 'none';
        show('mainScreen');
      }
    }
  } catch (err) {
    toast('新しいDBの作成に失敗しました。\n' + err.message);
  }
}

async function loadCurrentDb(){
  if (!activeDb) { toast('DBが選択されていません'); return; }
  try {
    const res = await apiGet('all', { spreadsheetId: activeDb.spreadsheetId });
    if (!res.ok) throw new Error(res.error || '読み込み失敗');
    items = res.items || [];
    settings = res.settings || {locations:[], stores:[]};
    updateSelectOptions();
    renderItems();
    toast('「' + activeDb.name + '」を読み込みました。' + items.length + '件');
  } catch (err) {
    toast('読み込みエラー: ' + err.message);
  }
}

async function saveItem(){
  const id = $('itemId').value || genId();
  const name = $('itemName').value.trim();
  if (!name) { toast('名称は必須です'); return; }
  const location = $('itemLocationCustom').value.trim() || $('itemLocation').value;
  const store = $('itemStoreCustom').value.trim() || $('itemStore').value;
  const item = {
    id, name,
    spec: $('itemSpec').value.trim(),
    quantity: Number($('itemQty').value) || 0,
    image: $('itemImageData').value || '',
    location,
    obtained: $('itemObtained').value,
    expiry: $('itemExpiry').value,
    store,
    price: Number($('itemPrice').value) || 0,
    memo: $('itemMemo').value.trim(),
    createdAt: items.find(x=>x.id===id)?.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  try {
    const res = await apiPost('saveItem', { item });
    if (!res.ok) throw new Error(res.error || '保存失敗');
    const idx = items.findIndex(x => x.id === id);
    if (idx >= 0) items[idx] = item; else items.push(item);
    renderItems();
    closeItemModal();
    toast('保存しました');
  } catch (err) {
    toast('保存エラー: ' + err.message);
  }
}

async function deleteItem(id){
  if (!confirm('この備品を削除しますか？')) return;
  try {
    const res = await apiPost('deleteItem', { id });
    if (!res.ok) throw new Error(res.error || '削除失敗');
    items = items.filter(x => x.id !== id);
    renderItems();
    toast('削除しました');
  } catch (err) {
    toast('削除エラー: ' + err.message);
  }
}

function updateSelectOptions(){
  const locSel = $('itemLocation');
  const storeSel = $('itemStore');
  const floc = $('filterLocation');
  const fsto = $('filterStore');
  const locs = [...new Set([...(settings.locations||[]), ...items.map(x=>x.location).filter(Boolean)])];
  const stos = [...new Set([...(settings.stores||[]), ...items.map(x=>x.store).filter(Boolean)])];
  locSel.innerHTML = '<option value="">選択</option>' + locs.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  storeSel.innerHTML = '<option value="">選択</option>' + stos.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  floc.innerHTML = '<option value="">保管場所</option>' + locs.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  fsto.innerHTML = '<option value="">購入先</option>' + stos.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
}

function renderItems(){
  console.log('renderItems viewMode:', viewMode, 'items:', items.length);
  const container = $('itemsContainer');
  const q = $('searchInput').value.trim().toLowerCase();
  const floc = $('filterLocation').value;
  const fsto = $('filterStore').value;
  let filtered = items.filter(it => {
    const text = (it.name+' '+it.spec+' '+it.location+' '+it.store+' '+it.memo).toLowerCase();
    return (!q || text.includes(q)) && (!floc || it.location === floc) && (!fsto || it.store === fsto);
  });
  $('resultCount').textContent = filtered.length + '件 / 登録:' + items.length + '件';
  if (!filtered.length) {
    container.className = viewMode === 'grid' ? 'item-grid' : (viewMode === 'listNoImg' ? 'item-list-noimg' : 'item-list');
    container.innerHTML = '<div class="empty-state">該当する備品がありません</div>';
    return;
  }

  // 画像なしリスト形式（番号付き・コンパクト）
  if (viewMode === 'listNoImg') {
    console.log('Rendering listNoImg mode');
    container.className = 'item-list-noimg';
    let html = filtered.map((it, idx) => `
      <div class="item-card">
        <div class="item-number">${idx + 1}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;margin-bottom:.15rem;color:#f8fafc;">${escapeHtml(it.name)}</div>
          <div style="font-size:.8rem;color:#e2e8f0;">
            ${it.spec ? escapeHtml(it.spec)+' · ' : ''}${it.quantity || 0}個 · ${escapeHtml(it.location||'場所未設定')}
            ${it.store ? ' · 購入:'+escapeHtml(it.store) : ''}${it.price ? ' · '+it.price+'円' : ''}${it.obtained ? ' · 購入日:'+fmtDate(it.obtained) : ''}
          </div>
          ${it.memo ? `<div style="font-size:.75rem;color:#cbd5e1;margin-top:.15rem;">${escapeHtml(it.memo)}</div>` : ''}
          <div class="action-btns" style="margin-top:.35rem;">
            <button class="secondary outline" onclick='editItem(${JSON.stringify(it).replace(/'/g,"\'")})'>編集</button>
            <button class="danger outline" onclick="deleteItem('${it.id}')">削除</button>
          </div>
        </div>
      </div>
    `).join('');
    html += `<div class="list-summary">合計 ${filtered.length} 件</div>`;
    container.innerHTML = html;
    return;
  }

  // 画像ありリスト形式
  if (viewMode === 'list') {
    console.log('Rendering list mode');
    container.className = 'item-list';
    container.innerHTML = filtered.map(it => `
      <div class="item-card">
        ${it.image ? `<img src="${escapeHtml(it.image)}" alt="">` : `<div class="img-placeholder">画像なし</div>`}
        <div>
          <div style="font-weight:700;margin-bottom:.25rem;color:#f8fafc;">${escapeHtml(it.name)}</div>
          <div style="font-size:.8rem;color:#e2e8f0;margin-bottom:.35rem;">
            ${it.spec ? escapeHtml(it.spec)+' · ' : ''}${it.quantity || 0}個 · ${escapeHtml(it.location||'場所未設定')}
          </div>
          <div style="font-size:.75rem;color:#cbd5e1;margin-bottom:.35rem;">
            ${it.store ? '購入:'+escapeHtml(it.store)+' · ' : ''}${it.price ? it.price+'円 · ' : ''}${it.obtained ? '購入:'+fmtDate(it.obtained) : ''}
          </div>
          ${it.memo ? `<div style="font-size:.75rem;color:#cbd5e1;margin-bottom:.35rem;">${escapeHtml(it.memo)}</div>` : ''}
          <div class="action-btns">
            <button class="secondary outline" onclick='editItem(${JSON.stringify(it).replace(/'/g,"\'")})'>編集</button>
            <button class="danger outline" onclick="deleteItem('${it.id}')">削除</button>
          </div>
        </div>
      </div>
    `).join('');
    return;
  }

  // カード形式（デフォルト）
  console.log('Rendering grid mode');
  container.className = 'item-grid';
  container.innerHTML = filtered.map(it => `
    <div class="item-card">
      ${it.image ? `<img src="${escapeHtml(it.image)}" alt="">` : `<div style="width:100%;height:140px;background:#1f2937;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:.8rem;">画像なし</div>`}
      <div style="flex:1;">
        <div style="font-weight:700;margin-bottom:.25rem;color:#f8fafc;">${escapeHtml(it.name)}</div>
        <div style="font-size:.8rem;color:#e2e8f0;margin-bottom:.35rem;">
          ${it.spec ? escapeHtml(it.spec)+' · ' : ''}${it.quantity || 0}個 · ${escapeHtml(it.location||'場所未設定')}
        </div>
        <div style="font-size:.75rem;color:#cbd5e1;margin-bottom:.35rem;">
          ${it.store ? '購入:'+escapeHtml(it.store)+' · ' : ''}${it.price ? it.price+'円 · ' : ''}${it.obtained ? '購入:'+fmtDate(it.obtained) : ''}
        </div>
        ${it.memo ? `<div style="font-size:.75rem;color:#cbd5e1;margin-bottom:.35rem;">${escapeHtml(it.memo)}</div>` : ''}
        <div class="action-btns">
          <button class="secondary outline" onclick='editItem(${JSON.stringify(it).replace(/'/g,"\'")})'>編集</button>
          <button class="danger outline" onclick="deleteItem('${it.id}')">削除</button>
        </div>
      </div>
    </div>
  `).join('');
}

function setView(mode){
  console.log('setView called:', mode);
  viewMode = mode;
  renderItems();
}

function escapeHtml(text){
  if (text == null) return '';
  return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showItemModal(){ $('itemModalTitle').textContent = '+ 備品を登録'; $('itemForm').reset(); $('itemId').value=''; $('imagePreview').classList.add('hidden'); $('itemImageData').value=''; $('itemObtained').value=today(); openModal('itemModal'); }
function closeItemModal(){ closeModal('itemModal'); }
function showNewDbModal(){ openModal('newDbModal'); }
function closeNewDbModal(){ closeModal('newDbModal'); }

function editItem(it){
  $('itemModalTitle').textContent = '備品を編集';
  $('itemId').value = it.id;
  $('itemName').value = it.name || '';
  $('itemSpec').value = it.spec || '';
  $('itemQty').value = it.quantity || 0;
  $('itemLocation').value = it.location || '';
  $('itemLocationCustom').value = '';
  $('itemObtained').value = fmtDate(it.obtained);
  $('itemExpiry').value = fmtDate(it.expiry);
  $('itemStore').value = it.store || '';
  $('itemStoreCustom').value = '';
  $('itemPrice').value = it.price || '';
  $('itemMemo').value = it.memo || '';
  $('itemImageData').value = it.image || '';
  if (it.image) { $('imagePreview').src = it.image; $('imagePreview').classList.remove('hidden'); }
  else { $('imagePreview').classList.add('hidden'); }
  openModal('itemModal');
}

function previewImage(input){
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    $('imagePreview').src = e.target.result;
    $('imagePreview').classList.remove('hidden');
    $('itemImageData').value = e.target.result;
  };
  reader.readAsDataURL(file);
}

function clearCache(){
  localStorage.clear();
  toast('キャッシュをクリアしました');
  setTimeout(()=>location.reload(), 800);
}

window.addEventListener('DOMContentLoaded', () => {
  if (!getManagerUrl()) {
    toast('config.js の MANAGER_URL を設定してください');
    return;
  }
  const lastDbId = localStorage.getItem('lastDbId');
  if (lastDbId) {
    refreshDbListForManage().then(() => {
      const db = databases.find(d => d.spreadsheetId === lastDbId);
      if (db) {
        activeDb = db;
        updateCurrentDbDisplay();
        $('dbScreen').style.display = 'none';
        show('mainScreen');
        loadCurrentDb();
      } else {
        initDbScreen();
      }
    });
  } else {
    initDbScreen();
  }
});
</script>
